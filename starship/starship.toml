# ~/.dotfiles/starship/starship.toml   (软链到 ~/.config/starship.toml)
# 配色跟终端保持同一色系。底色换成亮色米白 #eff1f5 后，Mocha 那批亮色在浅底上
# 对比度只有 2~3:1，所以路径单独换成 Latte 的 mauve 紫（4.8:1），其余按需再调。
#   #307820 绿（路径）  #8839ef 紫（提示符箭头）  #89b4fa 蓝（用户名/边框）
#   #f9e2af 黄（分支）  #f38ba8 红（git 状态、出错）
#   #a6e3a1 绿（成功）  #b4befe 淡紫（主机名）  #94e2d5 青（工具链版本）  #6c7086 灰（耗时/时间）
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

# ── format 必须写在所有 [表] 之前 ──────────────────────────────────────────
# 旧配置把 format 写在了 [package] 下面（TOML 里那会被当成 package 的键），
# 所以那份 format 从来没生效过，实际一直用 starship 默认格式 —— 这就是 git 状态
# 和工具链版本直接怼在路径后面、挤成一坨的原因。
# ──────────────────────────────────────────────────────────────────────────
# 两行布局：第一行 = 边框 + 路径 + git + 工具链 + 时间，第二行 = 只有提示符
format = """
[╭─](bold #89b4fa) $directory$git_branch$git_status$docker_context$python$nodejs$rust$golang$java$lua$nix_shell$time
[╰─](bold #89b4fa) $cmd_duration$status$character"""

# 注：bash 不支持右对齐提示符（只有 ble.sh / zsh / fish 支持 right_format），
# 所以「耗时 / 退出码 / 时间」都放在左边，而不是塞进 right_format 里当摆设。

[character]
# 提示符箭头用 mauve 紫，和青色/绿色系的状态符号区分开
success_symbol = '[➜](bold #8839ef)'
error_symbol = '[➜](bold #f38ba8)'
vimcmd_symbol = '[❮](bold #f9e2af)'

[username]
show_always = true
style_user = 'bold #89b4fa'
style_root = 'bold #f38ba8'
format = '[$user]($style)'

# 只在 ssh / 容器里显示主机名；本机日常敲命令时省掉一截噪音
[hostname]
ssh_only = true
style = '#b4befe'
format = '@[$hostname]($style)'

[directory]
truncation_length = 3
truncate_to_repo = false
# 路径用绿色：Latte 原绿 #40a02b 在米白底上只有 2.96:1，
# 这里用压暗一档的 #307820（4.8:1），和终端 ANSI 的 green 是同一个值。
style = 'bold #307820'
read_only = ' '
read_only_style = '#f9e2af'
format = '[$path]($style)[$read_only]($read_only_style)'

[git_branch]
symbol = ''
style = 'bold #FF1493'
format = ' [$symbol$branch]($style)'

[git_status]
style = '#FF1493'
format = ' ([$all_status$ahead_behind]($style))'
conflicted = '='
ahead = '⇡'
behind = '⇣'
diverged = '⇕'
up_to_date = ''
untracked = '?'
stashed = '≡'
modified = '!'
staged = '+'
renamed = '»'
deleted = '✘'

# 工具链统一「前置一个空格 + 青色」，避免和路径、git 粘在一起
[python]
format = ' [$symbol($version )(\($virtualenv\) )]($style)'
style = 'bold #94e2d5'

[nodejs]
format = ' [$symbol($version )]($style)'
style = 'bold #94e2d5'

[rust]
format = ' [$symbol($version )]($style)'
style = 'bold #94e2d5'

[golang]
format = ' [$symbol($version )]($style)'
style = 'bold #94e2d5'

[java]
format = ' [$symbol($version )]($style)'
style = 'bold #94e2d5'

[lua]
format = ' [$symbol($version )]($style)'
style = 'bold #94e2d5'

[docker_context]
format = ' [$symbol$context]($style)'
style = 'bold #94e2d5'

[cmd_duration]
min_time = 1000
format = '[$duration]($style) '
style = 'bold #6c7086'

[status]
# status 模块默认 disabled=true（starship 源码 status.rs:25-28），必须显式打开
disabled = false
format = '[$status]($style) '
style = 'bold #f38ba8'

[time]
disabled = false
time_format = '%H:%M'
format = ' [$time]($style)'
style = '#8839ef'

# 关掉用不上的模块
[package]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true
