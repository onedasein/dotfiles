# ~/.config/alacritty/alacritty.toml
# Alacritty 0.13+ 使用 TOML 格式；更老的版本用 alacritty.yml（YAML），字段名基本对应。
# 当前主题：亮色（Latte 原生米白底 #eff1f5）+ Catppuccin Latte 调色板，透明度已关闭。

[window]
# 由 niri 接管窗口装饰，终端自身不出标题栏
decorations = "none"
# 内边距：截图里的留白就来自这里，和 niri 的 gaps 叠加
padding = { x = 14, y = 12 }
# 1.0 = 完全不透明（亮色米白底必须不透明，否则会透出桌面）。
# 想再要「透出桌面」就把这里调回 0.8 左右，同时把 blur 打开。
opacity = 1.0
dynamic_padding = false
startup_mode = "Windowed"
# 模糊只在 opacity < 1 时才有意义，不透明时保持关闭
blur = false

[scrolling]
history = 20000
multiplier = 3

[font]
size = 14.0
# 装了 Nerd Font 才有图标；没有就退回 "monospace"
normal = { family = "FiraCode Nerd Font", style = "Regular" }
bold = { family = "FiraCode Nerd Font", style = "Bold" }
italic = { family = "FiraCode Nerd Font", style = "Italic" }

# ── 配色：Catppuccin Latte 的色相 + 为亮底调过的明度 ──────────────────
# 底色用 Latte 原生米白 #eff1f5。但 Latte 那套 ANSI 是给深色终端设计的，
# 原样放到米白底上：绿 #40a02b 对比度 2.96、黄 #df8e1d 2.31、青 #179299 3.31，
# 全都低于 4.5，`ls`/`grep`/`git` 的彩色输出会发虚。
# 这里保持色相不动、只把明度压暗，normal 色统一到 4.8:1 以上，bright 色到 6.8:1。
# bright 反而比 normal 更深是亮色主题的惯例：亮底上「更亮」等于看不见，
# 加深才能让粗体/高亮文字有区分度（GitHub Light 等亮色主题也是这么做的）。
# 想更白就把 background 改成 #ffffff 或 #fafafa，对比度只会更高。
[colors.primary]
background = "#eff1f5"
# 输入的命令/普通输出用纯黑，米白底上最清楚；想柔和一点可改 #111111 或 #1a1a1a
foreground = "#000000"
dim_foreground = "#7c7f93"
bright_foreground = "#000000"

[colors.cursor]
# 光标用纯黑方块：米白底上最醒目，也和「亮色主题 + 深色文字」的整体调性一致
text = "#eff1f5"
cursor = "#000000"

[colors.vi_mode_cursor]
# vi 模式的光标保持蓝色，和普通模式的黑光标区分开
text = "#eff1f5"
cursor = "#105cf4"

[colors.selection]
text = "#4c4f69"
background = "#ccd0da"

[colors.normal]
# 前两列是 Latte 原色，注释里的数字是在 #eff1f5 上的对比度
black = "#5c5f77"    # 5.53
red = "#d20f39"      # 4.80
green = "#307820"    # 4.84（原 #40a02b 只有 2.96）
yellow = "#935e13"   # 4.82（原 #df8e1d 只有 2.31）
blue = "#105cf4"     # 4.81（原 #1e66f5 只有 4.34）
magenta = "#8838ef"  # 4.81
cyan = "#13757b"     # 4.81（原 #179299 只有 3.31）
white = "#63697f"    # 4.81（Latte white #acb0be 只有 1.91）

[colors.bright]
black = "#4f5166"    # 6.87
red = "#a60c2d"      # 6.85
green = "#265e19"    # 6.88
yellow = "#744a0f"   # 6.80
blue = "#0947c4"     # 6.85
magenta = "#6912dc"  # 6.83
cyan = "#0f5c61"     # 6.82
white = "#4e5263"    # 6.85

[cursor]
style = { shape = "Block", blinking = "Off" }

[terminal]
osc52 = "CopyPaste"

# ── 复制粘贴 ──────────────────────────────────────────────────────────
# 默认就有 Ctrl+Shift+C / Ctrl+Shift+V；这里再把 Ctrl+V 也接到粘贴上，
# Ctrl+C 仍是发 SIGINT（终端里 Ctrl+C 必须能中断程序，不能拿来复制）。
[[keyboard.bindings]]
key = "c"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "v"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "v"
mods = "Control"
action = "Paste"

[[keyboard.bindings]]
key = "Insert"
mods = "Control"
action = "Copy"

[[keyboard.bindings]]
key = "Insert"
mods = "Shift"
action = "PasteSelection"

# 鼠标划选完立刻进系统剪贴板（Wayland 默认就是 true，这里写明方便以后改）
[selection]
save_to_clipboard = true
